<!DOCTYPE html>
<html lang="sr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Medi-Sport</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #f8fafc;
    }

    /* Print specific styles for single-page PDF export */
    @media print {
      @page {
        size: A4;
        margin: 4mm;
      }

      body {
        background-color: white !important;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
        font-size: 8pt;
        width: 100% !important;
        margin: 0 !important;
        padding: 0 !important;
      }

      /* Force single page */
      html,
      body,
      #root,
      #root>div {
        height: auto !important;
        min-height: auto !important;
        overflow: visible !important;
        width: 100% !important;
        position: static !important;
      }

      .no-print {
        display: none !important;
      }

      .print-only {
        display: block !important;
      }

      /* Fit content to A4 width */
      * {
        max-width: 100% !important;
        box-sizing: border-box !important;
      }

      /* Condense for print */
      .space-y-8>*+* {
        margin-top: 0.2rem !important;
      }

      .p-4,
      .p-6,
      .md:p-6 {
        padding: 0 !important;
      }

      .mb-4,
      .mb-6 {
        margin-bottom: 0.1rem !important;
      }

      .pb-2 {
        padding-bottom: 0 !important;
      }

      /* Single Column Layout (Removing Grid) */
      .print-grid {
        display: block !important;
        width: 100% !important;
      }

      /* Ensure sections don't break halfway */
      section {
        break-inside: avoid !important;
        border: 1px solid #e2e8f0 !important;
        padding: 2px !important;
        border-radius: 4px !important;
        width: 100% !important;
        background-color: white !important;
        margin-bottom: 4px !important;
      }

      h1 {
        font-size: 1rem !important;
        margin: 0 !important;
      }

      h2 {
        font-size: 0.9rem !important;
        margin-bottom: 2px !important;
      }

      /* Flatten cards */
      .shadow-sm,
      .shadow-md,
      .shadow-lg {
        box-shadow: none !important;
      }

      /* Table adjustments for print */
      table {
        width: 100% !important;
        border-collapse: collapse !important;
      }

      th,
      td {
        padding: 1px 3px !important;
        font-size: 7pt !important;
        border: 1px solid #f1f5f9 !important;
      }

      /* Ensure columns don't overflow */
      .truncate {
        overflow: visible !important;
        white-space: normal !important;
        text-overflow: clip !important;
      }

      /* Hide browser default header/footer */
      header,
      footer {
        display: none !important;
      }
    }

    .print-only {
      display: none;
    }
  </style>
